name: nordwerk-withdrawal
services:
  php:
    build: ./docker/php
    working_dir: /workspace/app
    volumes:
      - .:/workspace
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-change-me-too}
      DATABASE_URL: mysql://contao:contao@db:3306/contao?serverVersion=mariadb-11.8.9&charset=utf8mb4
      MAILER_DSN: smtp://mailpit:1025
      WITHDRAWAL_MERCHANT_EMAIL: ${WITHDRAWAL_MERCHANT_EMAIL:-shop@example.test}
      CONTAO_ADMIN_EMAIL: ${CONTAO_ADMIN_EMAIL:-admin@example.test}
      CONTAO_ADMIN_PASSWORD: ${CONTAO_ADMIN_PASSWORD:-change-me}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
  caddy:
    image: caddy:2-alpine
    ports:
      - "8081:80"
    volumes:
      - ./app/public:/workspace/app/public:ro
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - php
  db:
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: contao
      MARIADB_USER: contao
      MARIADB_PASSWORD: contao
      MARIADB_ROOT_PASSWORD: local-only
    tmpfs:
      - /var/lib/mysql:size=512m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"
